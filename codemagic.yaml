
workflows:
  spotui-android:
    name: Spotui Android APK
    max_build_duration: 60
    
    environment:
      java: 17
    scripts:
      - name: Build debug APK
        script: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
  
